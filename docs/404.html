<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    O GitHub Pages serve este arquivo no endereço que não existe, em qualquer
    profundidade — um caminho relativo (assets/…) apontaria para o lugar
    errado. Por isso a página se basta: estilo aqui dentro, sem script, nos
    três idiomas de uma vez, e o link da home com o endereço inteiro.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Página não encontrada — clockin.it</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f8f3;
      --surface: #ffffff;
      --text: #14222a;
      --text-muted: #4c5f6a;
      --border: rgba(20, 34, 42, 0.1);
      --mark-ring: #3b4e59;
      --brand: #64bb46;
      --on-brand: #0c2406;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a1114;
        --surface: #131f25;
        --text: #eaf1f3;
        --text-muted: #9fb3bd;
        --border: rgba(255, 255, 255, 0.09);
        --mark-ring: #dfe8ec;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      display: grid;
      gap: 18px;
      justify-items: center;
      max-width: 520px;
      padding: 40px 32px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--surface);
      text-align: center;
    }

    svg {
      width: 84px;
      height: 84px;
    }

    .ring {
      fill: var(--mark-ring);
    }

    .accent {
      fill: var(--brand);
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--text-muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      margin-top: 6px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--brand);
      color: var(--on-brand);
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect class="accent" x="37" y="5" width="26" height="14" rx="4"/>
      <path class="ring" fill-rule="evenodd" d="M50 14a40 40 0 1 0 0 80 40 40 0 0 0 0-80zm0 15.5a24.5 24.5 0 1 1 0 49 24.5 24.5 0 0 1 0-49z"/>
      <path class="accent" d="M50 37.5a3 3 0 0 1 3.4-3A19.5 19.5 0 0 1 69.5 50.6a3 3 0 0 1-3 3.4H53a3 3 0 0 1-3-3V37.5z"/>
    </svg>
    <h1>Esta página não existe</h1>
    <p lang="pt-BR">O endereço pode ter mudado. Os apps e os downloads estão na página inicial.</p>
    <p lang="en">The address may have changed. The apps and the downloads are on the home page.</p>
    <p lang="es">La dirección puede haber cambiado. Las apps y las descargas están en la página de inicio.</p>
    <a href="https://clockin-it.github.io/app-distribution/">clockin.it</a>
  </main>
</body>
</html>
